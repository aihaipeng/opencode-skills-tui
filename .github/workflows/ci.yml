name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Mirrors the dev environment (Windows) so CI failures map 1:1 to local runs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run test
